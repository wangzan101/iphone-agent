<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPhone Agent</title>
<!--
  ⚠ 这是**网页**，不是原生窗口。浏览器已经有一套 chrome，将来打包成 .app
  系统还会再给一套 —— 页面里不画红绿灯、不画标题栏（docs/22 D5）。
  也没有任何外部资源：这是个离线的本机工具，断网也得能用。
-->
<link rel="stylesheet" href="app.css">

<div id="app">

  <nav id="sidebar">
    <div class="brand">
      <span class="bi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10.5 18.5h3"/></svg></span>
      <span class="bt">iPhone Agent</span>
    </div>

    <button class="sitem" data-nav="chat" title="对话" data-i18n-title="nav.chat" aria-current="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.1 9.1 0 0 1-3.3-.6L3 21l1.8-5a8.2 8.2 0 0 1-.8-3.5 8.4 8.4 0 0 1 8.5-8.4 8.4 8.4 0 0 1 8.5 8.4z"/></svg>
      <span class="lb" data-i18n="nav.chat">对话</span>
    </button>
    <button class="sitem" data-nav="learned" title="知识" data-i18n-title="nav.knowledge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span class="lb" data-i18n="nav.knowledge">知识</span><span class="badge" id="learnedBadge" hidden>0</span>
    </button>
    <button class="sitem" data-nav="settings" title="设置" data-i18n-title="nav.settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      <span class="lb" data-i18n="nav.settings">设置</span>
    </button>

    <div class="snav-h" data-i18n="nav.recent">最近</div>
    <div id="runs"></div>

    <div class="language-row"><select class="language-select" data-language-select aria-label="Interface language" data-i18n-aria-label="language.label">
        <option value="en">English</option><option value="zh-CN">简体中文</option>
      </select></div>
    <div id="sfoot">
      <button class="cbtn" id="detail" title="显示每一步的原始参数" data-i18n-title="detail.title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m9 17-5-5 5-5M15 7l5 5-5 5"/></svg>
        <span class="lb" data-i18n="detail.label">细节</span>
      </button>
      <button class="cbtn" id="themebtn" title="切换外观：跟随系统 / 浅色 / 深色" data-i18n-title="theme.title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <button id="sstatus" data-nav="settings">
      <span class="dot" id="sdot"></span>
      <span class="txt"><b id="sst1" data-i18n="state.connecting">连接中…</b><span id="sst2"></span></span>
    </button>
  </nav>

  <main id="main">

    <!-- ═══ 对话 ═══ -->
    <section class="pane on" data-pane="chat">
      <div id="chatwrap">
        <div id="chatcol">
          <div id="chathead">
            <button class="cbtn" id="newchat" title="新对话" data-i18n-title="chat.newChat">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              <span class="lb" data-i18n="chat.newChat">新对话</span>
            </button>
          </div>
          <div id="banners"></div>
          <div id="log"></div>
          <div id="bar">
            <div id="barin">
              <textarea id="q" rows="1" placeholder="想让它做什么？" data-i18n-placeholder="chat.prompt"></textarea>
              <button id="pause" title="暂停" data-i18n-title="action.pause" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg>
              </button>
              <button id="send" title="发送" data-i18n-title="action.send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              </button>
            </div>
            <div class="hint" data-i18n="chat.hint">回车发送 · Shift + 回车换行 · 本机执行，屏幕与任务内容可能发送给所选模型</div>
          </div>
        </div>

        <aside id="right">
          <div id="rhead">
            <!-- ⚠ 折叠走这个小按钮，不走「点画面」—— 点整块画面太容易误触，
                 而且它得留给「放大看」。 -->
            <button id="fold" title="收起手机画面" data-i18n-title="screen.collapse">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <span id="rtitle" data-i18n="screen.title">手机当前画面</span>
            <span class="live"><span class="dot" id="rdot"></span><span id="rlive" data-i18n="state.idle">待机</span></span>
          </div>
          <!-- 折叠态的竖条：状态点继续跳，竖排显示「第 N 步」，不自动展开 -->
          <div id="rail">
            <span class="dot" id="raildot"></span>
            <span id="railtxt" data-i18n="state.idle">待机</span>
          </div>
          <div id="stage">
            <div class="phone" id="phone" title="点开放大" data-i18n-title="screen.zoom">
              <div class="screen">
                <div class="island"></div>
                <img id="shot" alt="手机画面" data-i18n-alt="screen.alt">
                <div id="hud"><span class="a"></span><span class="b"></span></div>
              </div>
            </div>
          </div>
          <div id="rmeta"></div>
        </aside>
      </div>
    </section>

    <!-- ═══ 知识 ═══ -->
    <section class="pane" data-pane="learned">
      <div class="phead">
        <h1 data-i18n="knowledge.title">它学会了什么</h1>
        <p data-i18n="knowledge.subtitle">这里显示从任务中积累的 App 知识、操作步骤和跨任务记忆。</p>
      </div>
      <div class="scroll"><div class="wrap" id="learnedBody"></div></div>
    </section>

    <!-- ═══ 设置 ═══ -->
    <section class="pane" data-pane="settings">
      <div class="phead"><h1 data-i18n="nav.settings">设置</h1></div>
      <div class="scroll"><div class="wrap" id="settingsBody"></div></div>
    </section>

    <!-- 放大看某一帧 + 回放整次运行 -->
    <div id="zoom" hidden>
    <div class="zphone"><div class="zscreen"><div class="island"></div><img id="zshot" alt="放大的手机画面" data-i18n-alt="screen.zoomAlt"></div></div>
    <div id="zside">
      <div id="ztitle"></div>
      <div id="zkv"></div>
      <div id="zplay">
        <button class="btn" id="zpp" data-i18n="replay.play">▶ 播放</button>
        <div id="zprog"><i></i></div>
        <button class="btn" id="zspd">1×</button>
        <button class="btn" id="zrst">↺</button>
      </div>
      <div id="zsteps"></div>
      <div class="esc" data-i18n="zoom.closeHint">按 ESC 或点空白处关闭</div>
    </div>
  </div>
  </main>

  <!--
    首启只做**一件事**：接上一个模型。
    权限那些留在设置页里，位置靠后 —— 第一次打开就被六步向导拦住，
    人还没看见这东西能干嘛就先被要走两个系统授权，劝退。
  -->
  <div id="setup" hidden>
    <div class="sheet">
      <div class="language-row setup-language"><select class="language-select" data-language-select aria-label="Interface language" data-i18n-aria-label="language.label">
        <option value="en">English</option><option value="zh-CN">简体中文</option>
      </select></div>
      <div class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 0 1 5 5v1a4 4 0 0 1 0 8v1a5 5 0 0 1-10 0v-1a4 4 0 0 1 0-8V7a5 5 0 0 1 5-5z"/><path d="M12 2v20"/></svg></div>
      <h2 data-i18n="setup.title">先接上一个模型</h2>
      <p data-i18n="setup.intro">需要你自己的模型 API 密钥。屏幕和任务内容可能发送给所选模型；连接测试也会发出一次模型请求。</p>
      <div id="setupBody"></div>
      <div class="acts">
        <button class="mini" id="setupLater" data-i18n="setup.later">稍后再说</button>
        <span class="grow"></span>
        <button class="btn big pri" id="setupGo" data-i18n="setup.go">测试并开始</button>
      </div>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
